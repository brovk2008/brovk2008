<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="1254" height="1254" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Star Crystal</title>
  <defs>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#9fd0ff"/><stop offset="1" stop-color="#3f6cff"/>
    </linearGradient>
    <linearGradient id="lav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#e3cfff"/><stop offset="1" stop-color="#7f97ff"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb4ff"/><stop offset=".5" stop-color="#3a5bff"/><stop offset="1" stop-color="#8aa6ff"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f4ff" stop-opacity=".95"/><stop offset=".5" stop-color="#8fb0ff" stop-opacity=".6"/><stop offset="1" stop-color="#6a6bff" stop-opacity=".25"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#cfe6ff" stop-opacity=".9"/><stop offset="1" stop-color="#4f7bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#5b8cff" stop-opacity=".45"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <path id="spark" d="M0-1Q.1-.1 1 0Q.1 .1 0 1Q-.1 .1 -1 0Q-.1 -.1 0-1Z"/>
    <path id="leaf" d="M0 0C-16-28-10-62 0-92C10-62 16-28 0 0Z"/>
  </defs>

  <!-- Background made transparent for theme -->

  <!-- Ambient halo -->
  <circle cx="627" cy="600" r="380" fill="url(#halo)"/>

  <!-- Orbit rings -->
  <g fill="none" stroke="#a9c4ff" stroke-width="1.6" opacity=".7">
    <circle cx="627" cy="600" r="345"/>
    <circle cx="627" cy="600" r="395" opacity=".5"/>
    <ellipse cx="627" cy="600" rx="440" ry="235" transform="rotate(-28 627 600)"/>
    <ellipse cx="627" cy="600" rx="430" ry="220" transform="rotate(32 627 600)" opacity=".6"/>
  </g>

  <!-- Ribbons -->
  <g fill="url(#ribbon)" stroke="#d6e6ff" stroke-width="1.5" stroke-linejoin="round" filter="url(#glow)">
    <path d="M720 410C800 340 960 300 1050 345C1085 372 1040 440 985 485C1002 430 960 380 900 380C830 380 770 400 720 410Z"/>
    <path d="M985 485C1000 520 985 560 962 575C975 540 975 510 985 485Z"/>
    <path d="M700 790C800 900 900 960 1010 940C1070 925 1085 880 1060 840C1050 900 980 920 900 890C820 860 750 820 700 790Z"/>
    <path d="M760 1100C880 1090 990 1020 1040 940C1000 990 900 1050 760 1100Z"/>
    <path d="M560 822C450 905 300 905 230 845C190 805 210 760 262 730C240 780 280 812 340 812C420 808 500 790 560 822Z"/>
    <path d="M590 440C480 360 330 320 250 342C200 362 190 420 215 470C220 420 250 392 320 392C420 396 520 420 590 440Z"/>
    <path d="M270 570C255 520 265 470 285 440C285 490 285 530 270 570Z"/>
  </g>

  <!-- Horizontal axis spikes -->
  <g filter="url(#glow)">
    <path d="M15 595L627 584L1240 595L627 606Z" fill="url(#lav)" opacity=".9"/>
    <path d="M185 595L440 566L627 595L440 624Z" fill="url(#ice)" opacity=".85"/>
    <path d="M1070 595L815 566L627 595L815 624Z" fill="url(#lav)" opacity=".85"/>
    <path d="M440 624L540 690L627 595Z" fill="#7aa2ff" opacity=".75"/>
    <path d="M815 624L715 690L627 595Z" fill="#b7a6ff" opacity=".75"/>
    <path d="M440 566L540 505L627 595Z" fill="#cfe6ff" opacity=".8"/>
    <path d="M815 566L715 505L627 595Z" fill="#e7d9ff" opacity=".8"/>
  </g>

  <!-- Leaf crystals -->
  <g fill="url(#lav)" stroke="#eaf3ff" stroke-width="1.2" opacity=".92" filter="url(#glow)">
    <use href="#leaf" transform="translate(385 352) rotate(-38) scale(.85)"/>
    <use href="#leaf" transform="translate(372 560) rotate(-62) scale(.95)"/>
    <use href="#leaf" transform="translate(520 470) rotate(-52) scale(.7)"/>
    <use href="#leaf" transform="translate(425 900) rotate(-158) scale(.95)" />
    <use href="#leaf" transform="translate(750 660) rotate(122) scale(.75)"/>
    <use href="#leaf" transform="translate(700 530) rotate(55) scale(.65)"/>
    <use href="#leaf" transform="translate(790 190) rotate(-22) scale(.5)"/>
  </g>

  <!-- Main vertical crystal -->
  <g filter="url(#glow)" stroke="#f2f8ff" stroke-width="1.4" stroke-linejoin="round">
    <path d="M627 115L560 330L545 440L627 595Z" fill="url(#ice)"/>
    <path d="M627 115L700 330L728 470L627 595Z" fill="url(#lav)"/>
    <path d="M627 245L590 420L627 595L652 420Z" fill="#fff" fill-opacity=".35"/>
    <path d="M627 595L535 730L627 1015Z" fill="url(#deep)"/>
    <path d="M627 595L720 730L627 1015Z" fill="url(#lav)"/>
    <path d="M627 595L580 760L627 1015" fill="#fff" fill-opacity=".25"/>
    <path d="M627 430L745 590L627 790L515 590Z" fill="url(#deep)"/>
    <path d="M627 430L680 590L627 790" fill="#fff" fill-opacity=".22" stroke="none"/>
  </g>

  <!-- Bottom and top finials -->
  <g fill="none" stroke="#cfe0ff" stroke-width="2" filter="url(#glow)">
    <path d="M627 1015C625 1060 600 1085 560 1100M627 1015C629 1060 655 1085 695 1100"/>
    <path d="M510 990C540 1040 600 1070 627 1100M745 990C715 1040 655 1070 627 1100" opacity=".7"/>
  </g>

  <!-- Core glow -->
  <circle cx="627" cy="595" r="120" fill="url(#core)"/>
  <circle cx="627" cy="595" r="30" fill="#fff" filter="url(#soft)"/>

  <!-- Sparkles -->
  <g fill="#fff" filter="url(#glow)">
    <use href="#spark" transform="translate(627 595) scale(70 70)"/>
    <use href="#spark" transform="translate(627 70) scale(30 62)"/>
    <use href="#spark" transform="translate(627 1140) scale(30 62)"/>
    <use href="#spark" transform="translate(185 595) scale(42 70)" fill="#dbe9ff"/>
    <use href="#spark" transform="translate(1070 595) scale(42 70)" fill="#dbe9ff"/>
    <use href="#spark" transform="translate(465 245) scale(20 40)"/>
    <use href="#spark" transform="translate(882 345) scale(14 38)"/>
    <use href="#spark" transform="translate(880 430) scale(30 30)"/>
    <use href="#spark" transform="translate(752 985) scale(24 48)"/>
    <use href="#spark" transform="translate(262 830) scale(10 28)" opacity=".8"/>
  </g>

  <!-- Particles -->
  <g fill="#cfe0ff" opacity=".85">
    <circle cx="455" cy="190" r="2.5"/><circle cx="800" cy="170" r="3"/><circle cx="940" cy="520" r="2"/>
    <circle cx="420" cy="715" r="3"/><circle cx="490" cy="1065" r="3.5"/><circle cx="1095" cy="925" r="3"/>
    <circle cx="905" cy="820" r="2"/><circle cx="330" cy="445" r="2"/><circle cx="975" cy="700" r="2.5"/>
  </g>
</svg>
